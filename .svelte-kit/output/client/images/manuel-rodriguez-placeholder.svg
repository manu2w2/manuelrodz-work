<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eceae2" />
      <stop offset="100%" stop-color="#e2ded4" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d5d2c7" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Canvas background with subtle engineering grid -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Frame hairline -->
  <rect x="12" y="12" width="376" height="456" fill="none" stroke="#9c988b" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Stylized Engineering Portrait Silhouette -->
  <g fill="none" stroke="#2c4c3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head outline -->
    <path d="M 200 120 C 160 120, 150 150, 150 190 C 150 235, 170 270, 200 270 C 230 270, 250 235, 250 190 C 250 150, 240 120, 200 120 Z" fill="#f7f6f2" stroke="#2c4c3b" stroke-width="2"/>
    
    <!-- Hairline / brow style -->
    <path d="M 160 160 C 175 145, 225 145, 240 160" />
    <path d="M 152 180 C 158 135, 242 135, 248 180" />
    
    <!-- Glasses / engineering gaze -->
    <rect x="165" y="180" width="28" height="20" rx="3" fill="#ffffff" fill-opacity="0.8" stroke="#2c4c3b" stroke-width="1.75" />
    <rect x="207" y="180" width="28" height="20" rx="3" fill="#ffffff" fill-opacity="0.8" stroke="#2c4c3b" stroke-width="1.75" />
    <line x1="193" y1="188" x2="207" y2="188" stroke="#2c4c3b" stroke-width="1.75" />
    
    <!-- Collar & Shoulders -->
    <path d="M 175 270 L 160 310 L 90 350 C 75 360, 70 380, 70 410 L 70 460 L 330 460 L 330 410 C 330 380, 325 360, 310 350 L 240 310 L 225 270 Z" fill="#eceae2" stroke="#2c4c3b" stroke-width="2"/>
    <path d="M 160 310 L 200 370 L 240 310" stroke="#2c4c3b" stroke-width="1.75"/>
    <line x1="200" y1="370" x2="200" y2="460" stroke="#2c4c3b" stroke-width="1.5" stroke-dasharray="2 3"/>
  </g>
  
  <!-- Optical alignment marks -->
  <g stroke="#9e4a47" stroke-width="1.25">
    <line x1="20" y1="20" x2="35" y2="20" />
    <line x1="20" y1="20" x2="20" y2="35" />
    <line x1="380" y1="20" x2="365" y2="20" />
    <line x1="380" y1="20" x2="380" y2="35" />
    <line x1="20" y1="460" x2="35" y2="460" />
    <line x1="20" y1="460" x2="20" y2="445" />
    <line x1="380" y1="460" x2="365" y2="460" />
    <line x1="380" y1="460" x2="380" y2="445" />
  </g>
  
  <!-- Subtitle badge -->
  <text x="200" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#525651" text-anchor="middle" letter-spacing="1.5">
    REGISTRO DOCUMENTAL · 2026
  </text>
</svg>
